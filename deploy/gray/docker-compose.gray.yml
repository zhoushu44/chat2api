# 灰度部署：单镜像版（chat2api + regiforge 同容器）
#
# 背景：早期方案是多容器 + 外部网络 regiforge_default，容器间靠 DNS 互访，
#   曾出现 `dial tcp: lookup regiforge: no such host`。
#   现已合并为单镜像（Dockerfile.single），不再需要跨容器网络，本文件同步简化。
#
# 使用：在仓库根目录执行
#   docker compose -f deploy/gray/docker-compose.gray.yml up -d --build
# 老 Python 容器（:3000）保持不动，本服务占 :3077。
services:
  chatgpt2api-gray:
    build:
      context: ../..
      dockerfile: Dockerfile.single
    image: zhoushu1/chat2api:7.0
    container_name: chatgpt2api-gray
    ports:
      - "3077:3077"
      - "6061:6060"
    volumes:
      - ./data:/data
    environment:
      - STORAGE_BACKEND=json
      - CHATGPT2API_AUTH_KEY=${GRAY_AUTH_KEY:?set GRAY_AUTH_KEY env}
      # 单镜像内 regiforge 固定跑在 127.0.0.1:8787（镜像默认值，此处显式声明便于排查）
      - REGIFORGE_BASE_URL=http://127.0.0.1:8787
      - REGIFORGE_PROJECT_ID=chatgpt_register
      - REGIFORGE_PROXY_ID=wary
      - REGIFORGE_EMAIL_ID=mailnest
      # 注册用代理池（自动同步到 RegiForge）
      - REGIFORGE_PROXY_API_URL=${REGIFORGE_PROXY_API_URL:-}
      - REGIFORGE_PROXY_API_KEY=${REGIFORGE_PROXY_API_KEY:-}
      # 注册成功账号自动入库（同容器 3077）
      - REGIFORGE_EXPORT_BASE_URL=http://127.0.0.1:3077
      - REGIFORGE_EXPORT_ADMIN_PASSWORD=${GRAY_AUTH_KEY}
      # 生图出站代理（socks5 非 CN 出口）
      - CHATGPT2API_PROXY=${CHATGPT2API_PROXY:-}
    shm_size: "1gb"
    restart: unless-stopped
