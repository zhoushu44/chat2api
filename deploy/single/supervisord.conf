[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:regiforge]
# 8787 由独立 regiforge 容器占用（docker-proxy 绑 127.0.0.1:8787）。
# 14 为 host 网络，内嵌实例无法绑定同端口，故 autostart=false（与原项目实际运行形态一致）。
command=xvfb-run -a -s "-screen 0 1920x1080x24" python -m uvicorn web.app:app --host 127.0.0.1 --port 8787
directory=/opt/regiforge
autostart=false
autorestart=false
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chatgpt2api]
command=/chatgpt2api-go -config /data/config.json -addr :3077
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
