[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:regiforge]
# Chrome 需要 Xvfb 虚拟显示（与 regiforge 官方 Dockerfile 一致）
command=xvfb-run -a -s "-screen 0 1920x1080x24" python -m uvicorn web.app:app --host 127.0.0.1 --port 8787
directory=/opt/regiforge
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:chatgpt2api]
command=/chatgpt2api-go -config /data/config.json -addr :3077
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
