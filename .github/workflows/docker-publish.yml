name: Build & Push Docker Image

# push 到 main / master 自动构建并推送到 Docker Hub；本地不执行任何推送
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE: zhoushu1/chat2api
  # 大版本号：升级时只改这一行，自动同步 20.1 + latest 双标签
  TAG_MAJOR: "20.1"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 登录 Docker Hub（凭证从 GitHub Secrets 读取）
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 设置 Buildx（docker-container driver，支持 GHA 缓存）
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送镜像（20.1 + latest 同一镜像）
        uses: docker/build-push-action@v6
        with:
          context: .
          # 单镜像全功能版：Go 主服务 + Python regiforge + Node V8 沙箱
          file: ./Dockerfile.single
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG_MAJOR }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 推送结果
        run: |
          echo "::notice::已推送完成"
          echo "  ${{ env.IMAGE }}:${{ env.TAG_MAJOR }}"
          echo "  ${{ env.IMAGE }}:latest"
          echo "拉取: docker pull ${{ env.IMAGE }}:latest"
