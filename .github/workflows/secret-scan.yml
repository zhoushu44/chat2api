name: Secret Scan

# 密钥泄露防护：
#   * push / PR 时扫描提交内容（含历史），防止密钥再次入库
#   * push 到 main / master 会触发 docker-publish.yml，本工作流独立并行运行
#
# 说明：本工作流只读扫描，不会修改仓库，也不会失败重试。
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 第一道：gitleaks（规则全，附带历史扫描）
  gitleaks:
    name: gitleaks 扫描
    runs-on: ubuntu-latest
    steps:
      - name: Checkout（含完整历史，便于扫描历史提交）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 运行 gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
        # 说明：gitleaks-action 检测到泄露时以非 0 退出，从而让本 job 失败。
        # 若某些历史遗留暂时无法清理，可先用下面的方式只扫描本次推送范围：
        #   GITLEAKS_ARGS: detect --config .gitleaks.toml --redact

  # 第二道：仓库自带的零依赖扫描器（与本地 pre-commit 完全同一套规则）
  # 好处：即使 gitleaks-action 或其配置出问题，这一道仍能独立兜底。
  repo-scan:
    name: 内置扫描器（全量）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 运行 tools/secret-scan.sh --all
        run: |
          set -o pipefail
          sh tools/secret-scan.sh --all
